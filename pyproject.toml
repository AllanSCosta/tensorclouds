[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorclouds"
version = "0.1.0"
description = "Equivariant Neural Networks"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "" }]
requires-python = ">=3.9"
dependencies = [
    "jax[cuda12_pip]==0.4.30",
    "jaxlib[cuda12_pip]==0.4.30",
    "numpy",
    "e3nn_jax==0.20.7", 
    "flax==0.8.4", 
    "einops", 
    "wandb"
]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]


[tool]
[tool.setuptools]
package-dir = { "" = "." }

[tool.pydocstyle]
select = ["D415", "D403"]

[tool.black]
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    .git
    | .venv
    | _build
    | build
    | dist
)/
'''

[tool.flake8]
ignore = ["E741", "E203", "W503", "E731", "E721"]
max-line-length = 127
max-complexity = 64

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.pip.index-url]]
url = "https://storage.googleapis.com/jax-releases/jax_cuda_releases.html"
